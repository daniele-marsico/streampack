# App Android di StreamPack (Trusted Web Activity: mostra il sito come app, si aggiorna da sola col sito).
# Sostituisce PWABuilder. A ogni modifica in android-twa/ (o a mano da Actions → Run workflow):
#  1. compila l'AAB con numero di versione automatico (10 + numero della build)
#  2. SE ci sono i segreti della chiave lo firma
#  3. SE c'è anche l'account di servizio Play lo carica come BOZZA nel test "StreamPack"
#     (non va online finché non premi "Avvia implementazione" in Play Console)
# Segreti (Settings → Secrets and variables → Actions), tutti facoltativi:
#   TWA_KEYSTORE_B64, TWA_KEYSTORE_PASSWORD, TWA_KEY_ALIAS, TWA_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON
name: Android StreamPack
# VECCHIA app (TWA): sostituita dall'app nativa in app/ (android.yml). Resta solo da avviare a mano.
on:
  workflow_dispatch:
concurrency:
  group: android-twa
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Numero di versione
        run: echo "VERSION_CODE=$((10 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
      - name: Build AAB
        working-directory: android-twa
        run: chmod +x gradlew && ./gradlew bundleRelease --no-daemon
      - name: Firma (solo se ci sono i segreti)
        id: sign
        env:
          KS_B64: ${{ secrets.TWA_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TWA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.TWA_KEY_PASSWORD }}
        run: |
          mkdir -p out && cp android-twa/app/build/outputs/bundle/release/*.aab "out/StreamPack-$VERSION_CODE-unsigned.aab"
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "Chiave non impostata: AAB non firmato"; echo "signed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          cp "out/StreamPack-$VERSION_CODE-unsigned.aab" "out/StreamPack-$VERSION_CODE.aab"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/upload.keystore" \
            -storepass "$KS_PASS" -keypass "${KEY_PASS:-$KS_PASS}" "out/StreamPack-$VERSION_CODE.aab" "${KEY_ALIAS:-upload}"
          rm -f "$RUNNER_TEMP/upload.keystore" "out/StreamPack-$VERSION_CODE-unsigned.aab"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: StreamPack-aab, path: out/*.aab }
      - name: Play configurato?
        id: playcheck
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ] && [ "${{ steps.sign.outputs.signed }}" = "true" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Caricamento su Play saltato"; fi
      - name: Carica su Play (bozza)
        if: steps.playcheck.outputs.go == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: it.controllinghub.streampack
          releaseFiles: out/StreamPack-${{ env.VERSION_CODE }}.aab
          track: StreamPack
          status: draft
