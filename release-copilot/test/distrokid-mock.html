<!doctype html><html><body><h1>Upload</h1><form onsubmit="return false">
<div><label for="a">Artist/band name *</label><input id="a"></div>
<div><label>Release date</label><input type="date" name="rd"></div>
<div><label>Record label (optional)</label><input name="lbl"></div>
<div><p>Primary genre</p><select name="g1"><option value="">Select</option><option value="7">Pop</option><option value="9">R&amp;B/Soul</option><option value="3">Electronic</option></select></div>
<div><p>Secondary genre</p><select name="g2"><option value="">Select</option><option value="7">Pop</option><option value="3">Electronic</option></select></div>
<div><p>Language</p><select name="lang"><option value="">-</option><option>English</option><option>Italian</option></select></div>
<div><p>Album art</p><input type="file" accept="image/*" style="display:none" name="art"></div>
<div class="track"><h3>Track 1</h3>
 <input aria-label="Song title" name="t1">
 <div><span>Songwriter real name</span><input placeholder="First name" name="w1f"><input placeholder="Last name" name="w1l"></div>
 <div><p>Explicit lyrics?</p><label><input type="radio" name="ex1" value="1"> Yes</label><label><input type="radio" name="ex1" value="0"> No</label></div>
 <div><p>Is this song instrumental?</p><label><input type="radio" name="in1" value="1"> Yes</label><label><input type="radio" name="in1" value="0"> No</label></div>
 <div><p>Audio file</p><input type="file" accept=".wav,.flac,.mp3" name="au1"></div>
</div>
<div class="track"><h3>Track 2</h3>
 <input aria-label="Song title" name="t2">
 <div><span>Songwriter real name</span><input placeholder="First name" name="w2f"><input placeholder="Last name" name="w2l"></div>
 <div><p>Explicit lyrics?</p><label><input type="radio" name="ex2" value="1"> Yes</label><label><input type="radio" name="ex2" value="0"> No</label></div>
 <div><p>Is this song instrumental?</p><label><input type="radio" name="in2" value="1"> Yes</label><label><input type="radio" name="in2" value="0"> No</label></div>
 <div><p>Audio file</p><input type="file" accept=".wav,.flac,.mp3" name="au2"></div>
</div>
<div><label>Mystery field</label><input name="weird" id="weird"></div>
<button type="submit">Done</button></form></body></html>
